<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Select Services | Power Zone</title>

    <link rel="stylesheet" href="gym-front.css" />
    <link href="navbar.css" rel="stylesheet">
</head>

<body class="dark-page">

    <!-- protect page -->
    <script>
        if (!localStorage.getItem("token")) {
            window.location.href = "login.html";
        }
    </script>

    <div id="navbar"></div>

    <section class="services-page">

        <h1 class="services-title">CHOOSE YOUR SERVICES</h1>
        <p class="services-subtitle">
            Select the services you’re interested in. You can update these anytime.
        </p>

        <div class="services-grid">

            <label class="service-card">
                <input type="checkbox" />
                <div class="card-content">
                    <h3>Personal Trainer</h3>
                    <p>One-on-one training tailored to your fitness goals.</p>
                </div>
            </label>

            <label class="service-card">
                <input type="checkbox" />
                <div class="card-content">
                    <h3>Nutritionist</h3>
                    <p>Personalized diet plans to support your workouts.</p>
                </div>
            </label>

            <label class="service-card">
                <input type="checkbox" />
                <div class="card-content">
                    <h3>Weekend Sessions</h3>
                    <p>Group workouts and special bootcamp sessions.</p>
                </div>
            </label>

        </div>

        <button class="neon-next-btn" id="saveServicesBtn">
            SAVE & CONTINUE →
        </button>

    </section>

    <!-- LOAD SAVED SERVICES -->

    <script>
        async function loadSavedServices() {
            const token = localStorage.getItem("token");
            if (!token) return;

            try {
                const response = await fetch("https://power-zone-website.onrender.com/api/auth/services", {
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                });

                if (!response.ok) return;

                const services = await response.json();
                const checkboxes = document.querySelectorAll(".service-card input");

                checkboxes[0].checked = services.personalTrainer;
                checkboxes[1].checked = services.nutritionist;
                checkboxes[2].checked = services.weekendSession;

            } catch (err) {
                console.log("Could not load saved services");
            }
        }

        // run on page load
        loadSavedServices();
    </script>


    <!-- SAVE SERVICES -->
    <script>
        document.getElementById("saveServicesBtn").addEventListener("click", async () => {
            const checkboxes = document.querySelectorAll(".service-card input");

            const services = {
                personalTrainer: checkboxes[0].checked,
                nutritionist: checkboxes[1].checked,
                weekendSession: checkboxes[2].checked
            };

            const token = localStorage.getItem("token");

            try {
                const response = await fetch("https://power-zone-website.onrender.com/api/auth/services", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify(services)
                });

                const data = await response.json();

                if (response.ok) {
                    alert("Services saved successfully!");
                    window.location.href = "index.html";
                } else {
                    alert(data.message);
                }
            } catch (error) {
                alert("Something went wrong while saving services");
            }
        });
    </script>



    <script src="navbar.js"></script>
</body>

</html>
